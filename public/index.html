<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タスク管理ツール</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }
    header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }
    header h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }
    .main-content {
      display: flex;
      min-height: 600px;
    }
    .sidebar {
      width: 250px;
      background: #f7f9fc;
      border-right: 1px solid #e0e6ed;
      padding: 20px;
      overflow-y: auto;
    }
    .sidebar h3 {
      color: #333;
      margin-bottom: 15px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .projects-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 30px;
    }
    .project-btn {
      padding: 10px 15px;
      border: none;
      background: white;
      border-left: 3px solid transparent;
      cursor: pointer;
      text-align: left;
      transition: all 0.3s;
      border-radius: 4px;
    }
    .project-btn:hover {
      background: #e8eef7;
      border-left-color: #667eea;
    }
    .project-btn.active {
      background: #e8eef7;
      border-left-color: #667eea;
      font-weight: 600;
      color: #667eea;
    }
    .project-input-group {
      display: flex;
      gap: 5px;
      margin-bottom: 20px;
    }
